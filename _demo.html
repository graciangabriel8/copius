<!doctype html>
<meta charset="utf-8">
<title>Copius — demo reel</title>
<style>
  html,body{margin:0;height:100%;background:#0d0d0c;display:grid;place-items:center;
    font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  /* The app lays out at 387x688 — exactly 9:16 (387/9=43, 43x16=688), so the crop
     fills 1080x1920 with no letterbox. The first cut used a 390x844 stage: 0.462
     wide-to-tall against 9:16's 0.5625, which cost 96px of dark bar down each side.
     The stage is then 540x960, which on a 2x display is exactly 1080x1920 device
     pixels — so the crop is copied 1:1 into the Reel with no resampling at all.
     The iframe keeps its 387px layout width (every atlas breakpoint is
     max-width:720px, and the card grid stays one column at both sizes) and is
     scaled up to fill the stage. */
  :root{--k:1.3953488}  /* 540/387: the iframe scale, and the scale for everything
                           drawn over it that was sized against the old stage */
  #stage{position:relative;width:540px;height:960px;overflow:hidden;background:#F7F6F1;
    box-shadow:0 0 0 1px #222}
  #app{width:387px;height:688px;border:0;display:block;
    transform:scale(var(--k));transform-origin:0 0}
  /* caption band for muted viewing — most Reels are watched with sound off */
  #cap{position:absolute;left:0;right:0;bottom:0;
    padding:calc(26px*var(--k)) calc(22px*var(--k)) calc(34px*var(--k));
    background:linear-gradient(to top,rgba(10,10,9,.97) 55%,rgba(10,10,9,.88) 78%,transparent);
    color:#fff;font-size:calc(23px*var(--k));font-weight:600;letter-spacing:-.01em;line-height:1.25;
    opacity:0;transition:opacity .35s ease;text-wrap:balance;pointer-events:none}
  #cap.on{opacity:1}
  #cap small{display:block;font-size:calc(15px*var(--k));font-weight:400;opacity:.75;
    margin-top:calc(6px*var(--k))}
  #end{position:absolute;inset:0;background:#14160F;color:#f1f1f0;display:grid;
    place-content:center;text-align:center;gap:calc(10px*var(--k));opacity:0;
    transition:opacity .5s ease;pointer-events:none;padding:0 calc(30px*var(--k))}
  #end.on{opacity:1}
  #end .endmark{margin:0 auto calc(4px*var(--k));display:block;
    width:calc(104px*var(--k));height:auto}#end .endmark .bl-f{fill:#e2e2df;stroke:#585853;stroke-width:2.6;stroke-linejoin:round}#end .endmark .bl-s{fill:none;stroke:#585853;stroke-width:2.6;stroke-linecap:round}#end .endmark .bl-d{fill:#585853}#end b{font-size:calc(44px*var(--k));font-weight:600;letter-spacing:-.02em}
  #end span{font-size:calc(19px*var(--k));opacity:.72}
  #end i{font-style:normal;font-size:calc(17px*var(--k));opacity:.55;
    margin-top:calc(14px*var(--k))}
  /* a soft tap ring, so a viewer reads it as someone using it */
  #tap{position:absolute;width:calc(46px*var(--k));height:calc(46px*var(--k));
    margin:calc(-23px*var(--k)) 0 0 calc(-23px*var(--k));border-radius:50%;
    border:2px solid rgba(20,20,19,.5);opacity:0;pointer-events:none}
  #tap.go{animation:tap .5s ease-out}
  @keyframes tap{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.15)}}
  #hud{position:fixed;left:12px;top:12px;color:#666;font-size:12px}
  #hud button{font:inherit;background:#1c1c1a;color:#ddd;border:1px solid #333;
    border-radius:6px;padding:5px 11px;cursor:pointer}
</style>

<div id="hud"><button id="again">replay</button> <span id="state">loading…</span></div>

<div id="stage">
  <iframe id="app" src="atlas.html"></iframe>
  <div id="tap"></div>
  <div id="cap"></div>
  <div id="end">
    <svg class="endmark" viewBox="0 0 96 96" width="104" height="104" aria-hidden="true"><circle cx="48" cy="48" r="44" fill="#f1f1f0"/><g transform="translate(48 48) scale(0.78) translate(-48 -48)"><path class="bl-f" d="M52 24C30 32 16 52 20 66c2 9 12 12 17 6 4-5 0-12-5-10 4-12 16-22 34-24Z"></path><path class="bl-s" d="M52 24c9 4 14 11 14 20"></path><circle class="bl-d" cx="62" cy="20" r="7"></circle><circle class="bl-d" cx="75" cy="30" r="5.5"></circle><circle class="bl-d" cx="52" cy="11" r="4.5"></circle></g></svg><b>Copius</b>
    <span>1,835 ingredients, drawn and explained</span>
    <i>copius.fr</i>
  </div>
</div>

<script>
(function () {
  "use strict";
  var app = document.getElementById("app"), cap = document.getElementById("cap"),
      end = document.getElementById("end"), tap = document.getElementById("tap"),
      state = document.getElementById("state");
  var K = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--k")) || 1;

  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var D = function () { return app.contentDocument; };
  var q = function (s) { return D().querySelector(s); };

  function say(text, sub) {
    cap.innerHTML = text + (sub ? "<small>" + sub + "</small>" : "");
    cap.classList.add("on");
  }
  function hush() { cap.classList.remove("on"); }

  function ring(el) {
    if (!el) return;
    var r = el.getBoundingClientRect();
    tap.style.left = ((r.left + r.width / 2) * K) + "px";
    tap.style.top = ((r.top + r.height / 2) * K) + "px";
    tap.classList.remove("go"); void tap.offsetWidth; tap.classList.add("go");
  }

  async function type(sel, text, per) {
    var el = q(sel); if (!el) return;
    el.focus();
    for (var i = 1; i <= text.length; i++) {
      el.value = text.slice(0, i);
      el.dispatchEvent(new app.contentWindow.Event("input", {bubbles: true}));
      await wait(per || 150);
    }
  }

  async function openEntry(id) {
    var card = q('.card[data-id="' + id + '"]');
    if (!card) return false;
    card.scrollIntoView({block: "center"});
    await wait(240);
    ring(card);
    await wait(180);
    card.click();
    await wait(120);
    // Zero it here rather than trusting the app: the reel scrolls each card down
    // to show its facts, and the next card must not inherit that.
    var box = q("#overlay");
    if (box) box.scrollTop = 0;
    return true;
  }

  async function closeEntry() {
    var b = q("#closeBtn");
    if (b) { ring(b); await wait(140); b.click(); }
    await wait(320);
  }

  // Scroll the modal until something is in view, at a readable speed.
  //
  // Driven off the display's own refresh, and eased on the CLOCK rather than on a step
  // count: a fixed "steps = dur/16" loop assumes every setTimeout(16) lands on 16ms, so
  // whenever one ran long the scroll both stuttered and finished late. Reading the real
  // timestamp makes the motion frame-rate independent — it covers the same distance in
  // the same time whatever the machine does.
  //
  // rAF does not fire at all when the window is not compositing (a hidden pane, a
  // background tab), which silently froze every scroll at zero the first time this ran
  // headless. A real recording IS compositing, so rAF fires there; the timer below is
  // the fallback for the headless case, running the same easing.
  function scrollTo(box, target, dur) {
    return new Promise(function (done) {
      var W = app.contentWindow, start = box.scrollTop, delta = target - start;
      var t0 = null, raf = 0;
      function ease(k) { return k < .5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2; }
      function frame(now) {
        if (t0 === null) t0 = now;
        var k = Math.min(1, (now - t0) / dur);
        box.scrollTop = start + delta * ease(k);
        if (k < 1) raf = W.requestAnimationFrame(frame); else done();
      }
      raf = W.requestAnimationFrame(frame);
      setTimeout(function () {
        if (t0 !== null) return;            // rAF is alive; leave it alone
        W.cancelAnimationFrame(raf);
        var n = 0, steps = Math.max(2, Math.round(dur / 16));
        (function tick() {
          box.scrollTop = start + delta * ease(Math.min(1, ++n / steps));
          if (n < steps) setTimeout(tick, 16); else done();
        })();
      }, 120);
    });
  }

  // the pairing reveal — one tap turns ten chips into hundreds. This is the only
  // real motion in the product, so it carries the end of the reel.
  async function revealPairs() {
    var box = q("#overlay"), btn = q("#overlay .pair-more");
    if (!box || !btn) return false;
    var delta = btn.getBoundingClientRect().top - box.getBoundingClientRect().top;
    await scrollTo(box, box.scrollTop + delta - box.clientHeight + 150, 1100);
    await wait(700);
    ring(btn);
    await wait(260);
    btn.click();
    await wait(500);
    await scrollTo(box, box.scrollTop + 420, 1400);   // drift down through the flood
    return true;
  }

  // the modal is the hero; scroll it so the facts come into view under the drawing
  async function revealFacts() {
    var box = q("#overlay");
    if (!box) return;
    await scrollTo(box, Math.min(box.scrollHeight - box.clientHeight, 230), 900);
  }

  // One beat, identical for every card: open at the top, hold while the drawing
  // draws itself, scroll down to the facts, hold. Only butter continues past this.
  async function beat(term, id, line, sub) {
    await type("#search", term, 150);
    await wait(620);
    if (!await openEntry(id)) return false;
    say(line, sub);
    await wait(1500);          // the drawing draws itself — the distinctive bit
    await revealFacts();
    await wait(1500);
    return true;
  }

  async function closeAndClear() {
    hush();
    await closeEntry();
    var s = q("#search");
    if (s) { s.value = ""; s.dispatchEvent(new app.contentWindow.Event("input", {bubbles: true})); }
    await wait(240);
  }

  async function show(term, id, line, sub) {
    if (await beat(term, id, line, sub)) await closeAndClear();
  }

  async function run() {
    end.classList.remove("on"); hush();
    state.textContent = "playing";

    // an empty "add a photo" slot reads as unfinished on camera. Hide it for the
    // recording only — this file is not served as part of the site.
    var hide = D().createElement("style");
    hide.textContent = ".photo-actions,.drop-hint{display:none!important}.m-art{margin-bottom:10px}";
    D().head.appendChild(hide);

    // the app remembers a language; pin it so the recording is reproducible
    var en = q("#lang-en");
    if (en) { en.click(); await wait(600); }

    // Pin the THEME too. The atlas follows prefers-color-scheme unless a choice is
    // stored, and this machine is in dark mode, so without this the reel records dark
    // whatever the site's palette is. data-theme beats the media query in the CSS.
    try { app.contentWindow.localStorage.setItem("copius-theme", "light"); } catch (e) {}
    D().documentElement.setAttribute("data-theme", "light");
    await wait(400);

    // start at the grid, not the filter panel — nobody is sold by a filter panel
    app.contentWindow.scrollTo(0, 0);
    await wait(500);

    say("1,835 ingredients.", "Each one drawn, each one explained");
    await wait(1900); hush(); await wait(250);

    await show("saffron", "saffron", "What it is, and what it costs.", "Season · price · origin");
    await show("morel",   "morel",   "And what is easy to get wrong.", "One note on handling it");

    // same beat, then butter alone continues down into the pairing reveal
    if (await beat("butter", "butter", "And what it goes with.", "479 ingredients pair with butter")) {
      await revealPairs();
      await wait(1900);
      await closeAndClear();
    }

    end.classList.add("on");
    state.textContent = "done";
  }

  // The crop is only 1:1 if the stage lands on exactly 1080x1920 device pixels and all
  // of it is on screen. Both are easy to lose — a stray browser zoom, a window too short
  // for a 960px stage — and both are invisible until the recording is already made. Say
  // so before the take. This sits outside the stage, so it is never in the crop.
  var warn = null;
  function readyCheck() {
    var r = document.getElementById("stage").getBoundingClientRect(), dpr = window.devicePixelRatio;
    var w = Math.round(r.width * dpr), h = Math.round(r.height * dpr), bad = [];
    if (w !== 1080 || h !== 1920) bad.push("stage is " + w + "\u00d7" + h +
      " device px, not 1080\u00d71920 \u2014 set browser zoom back to 100%");
    if (r.top < 0 || r.bottom > window.innerHeight) bad.push("stage is cut off \u2014 make the window taller, or full screen");
    if (!bad.length) { if (warn) { warn.remove(); warn = null; } return; }
    if (!warn) {
      warn = document.createElement("div");
      warn.style.cssText = "position:fixed;left:12px;bottom:12px;z-index:9;max-width:330px;" +
        "background:#7a1f1f;color:#fff;padding:9px 13px;border-radius:7px;line-height:1.35";
      document.body.appendChild(warn);
    }
    warn.textContent = "Not ready to record \u2014 " + bad.join("; ");
  }
  readyCheck();
  window.addEventListener("resize", readyCheck);

  var started = false;
  app.addEventListener("load", function () {
    // the atlas loads 3.6 MB of data; wait for cards to exist rather than guess
    var tries = 0;
    (function poll() {
      if (D() && q(".card")) { if (!started) { started = true; run(); } return; }
      if (++tries > 120) { state.textContent = "atlas did not load"; return; }
      setTimeout(poll, 120);
    })();
  });

  document.getElementById("again").addEventListener("click", function () {
    if (state.textContent !== "playing") run();
  });
})();
</script>
