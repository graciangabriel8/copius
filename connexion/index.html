<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("copius-theme"),r=document.documentElement;if(t==="dark"||t==="light"){r.setAttribute("data-theme",t);var m=document.createElement("meta");m.name="theme-color";m.content=t==="dark"?"#14160F":"#F7F6F1";document.head.appendChild(m)}}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Connexion · Sign in — Copius</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" sizes="192x192" href="/icons/icon-192.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F6F1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14160F">
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../css/page.css?v=234">
<style>
  .cx{margin:10px 0 0;padding:11px 20px;border-radius:999px;border:1px solid var(--ink);
    background:var(--ink);color:var(--bg);font:600 15px/1.2 var(--sans);cursor:pointer}
  .cx:hover{opacity:.85}
  .cx:disabled{opacity:.5;cursor:default}
  .cx:focus-visible{outline:2px solid var(--ink-3);outline-offset:2px}
  .cx.quiet{background:transparent;color:var(--ink)}
  .steps{margin:4px 0 6px;padding-left:22px;line-height:1.6}
  .steps li{margin:0 0 6px}
  .steps a{color:var(--ink);text-underline-offset:3px}
  .acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
</style>
</head>
<body>
<header>
  <a class="home" href="../">Copius</a>
  <nav><a id="toAtlas" href="../atlas.html">Ouvrir l’atlas</a></nav>
</header>

<main>
<h1 id="title">Connexion à Copius</h1>
<p class="lede" id="msg" role="status"></p>
<ol class="steps" id="steps" hidden></ol>
<div class="acts">
<button type="button" class="cx" id="install" hidden></button>
<button type="button" class="cx" id="go" hidden></button>
</div>
</main>

<script src="../js/i18n.js?v=234"></script>
<script>
/* The page a sign-in link opens: https://copius.fr/connexion/#t=<token>&l=fr.
   What follows the # never reaches a server, a log or a Referer, and it leaves
   the address bar at once. The token is spent only on a click, so a mail
   scanner that opens the link cannot use it. In a browser the page first offers
   the app (steps, or the browser's own install prompt) and « continue on the
   website »; in the installed app it signs in at once. Endings: signed in (on to
   the home page, or told the app is installed), link expired or used, no access,
   cookies refused, no token. */
(function () {
  var h = location.hash, tok = (/(?:^#|&)t=([A-Za-z0-9_-]+)/.exec(h) || [])[1] || "";
  /* The link's language, else the atlas's own order: the saved choice, then
     the browser's. */
  var saved = ""; try { saved = localStorage.getItem("atlas-lang") || ""; } catch (e) {}
  var lang = (/(?:^#|&)l=(en|fr)(?:&|$)/.exec(h) || [])[1] ||
    (/^(en|fr)$/.test(saved) ? saved : /^fr/i.test(navigator.language || "") ? "fr" : "en");
  if (h && history.replaceState) history.replaceState(null, "", location.pathname);
  var t = window.I18N[lang], msg = document.getElementById("msg"), go = document.getElementById("go");
  var steps = document.getElementById("steps"), inst = document.getElementById("install");
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = t.cxTitle;
  document.getElementById("toAtlas").textContent = t.cxAtlas;
  function say(key) { msg.textContent = t[key]; }
  function done() { go.hidden = inst.hidden = steps.hidden = true; }
  if (!tok) { say("cxNoToken"); return; }

  /* Signs this browser in, once: true when it did, else the reason is said and,
     when the link is spent or refused, the buttons go. */
  var busy = null;
  function signIn() {
    if (busy) return busy;
    go.disabled = inst.disabled = true;
    busy = fetch("/api/verify.php", { method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: tok }) })
      .then(function (r) { return r.status; }, function () { return 0; })
      .then(function (s) {
        if (s === 200) {
          /* The server set both cookies; without the marker the atlas would
             never ask for the full version, so a refusal is said here. */
          if (!/(?:^|;\s*)__Host-copius_full=1(?:;|$)/.test(document.cookie)) { done(); say("cxCookies"); return false; }
          /* The site's other open tabs reload into the full version. */
          if (window.BroadcastChannel) new BroadcastChannel("copius-session").postMessage("changed");
          /* A new sign-in starts without the last one's offline copy of the
             full version (service-worker.js), which may be someone else's. */
          var yes = function () { return true; };
          try { if (window.caches) return caches.delete("premium-copius").then(yes, yes); } catch (e) {}
          return true;
        }
        busy = null;
        if (s === 410 || s === 403) { done(); say(s === 410 ? "cxExpired" : "sessionNoAccess"); return false; }
        /* Offline, or too many tries from this connection: the token is still
           good, so the buttons stay. */
        go.disabled = inst.disabled = false;
        say("cxError");
        return false;
      });
    return busy;
  }
  /* The home page, as for everyone; its button opens the atlas, now full. */
  function home() { signIn().then(function (ok) { if (ok) location.replace("/"); }); }

  /* Already in the installed app (a phone that opens copius.fr links in it): sign in here. */
  if ((window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true) {
    say("cxLead"); go.textContent = t.cxBtn; go.hidden = false; go.addEventListener("click", home);
    return;
  }

  /* In a browser, the app first: a browser's sign-in is lost to the next app a
     link opens in (Gmail, Instagram, another browser), the app keeps its own. On
     an iPhone, the app on the home screen shares nothing with Safari, so it signs
     in with the code this same mail carries and this link is left unspent. Elsewhere
     the app shares the browser's sign-in: sign in here, then install. */
  say("cxInstallLead");
  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  /* Safari on a Mac makes a web app with Share, « Add to Dock », and copies the
     site's sign-in into it at that moment: sign in here first, then add it. */
  var macSafari = !ios && /Macintosh/.test(ua) && /Version\/(1[7-9]|[2-9]\d)\.[\d.]* Safari\//.test(ua) && !/Chrome|Chromium|CriOS|Edg|OPR|Firefox/.test(ua);
  if (macSafari) {
    t.cxMacSteps.forEach(function (s) { var li = document.createElement("li"); li.textContent = s; steps.appendChild(li); });
  } else if (ios) {
    t.cxIosSteps.forEach(function (s) {
      var li = document.createElement("li"), at = s.indexOf("{l}");
      if (at < 0) li.textContent = s;
      else {
        var a = document.createElement("a"); a.href = "../atlas.html"; a.target = "_blank"; a.rel = "noopener";
        a.textContent = t.cxIosLink;
        li.append(s.slice(0, at), a, s.slice(at + 3));
      }
      steps.appendChild(li);
    });
  } else {
    var li = document.createElement("li"); li.textContent = t.cxMenuSteps; steps.appendChild(li);
  }
  steps.hidden = false;
  go.textContent = t.cxContinue; go.className = "cx quiet"; go.hidden = false; go.addEventListener("click", home);

  /* A browser that offers its own install prompt gets a button for it, in place of
     the menu steps. The prompt opens at once, in the click, while this browser signs
     in alongside, so the app it installs is already signed in. One handler, always on
     the latest offer: a prompt can be shown only once, and the browser may offer again. */
  var offer = null;
  if (!ios) window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    offer = e;
    steps.hidden = true;
    inst.textContent = t.cxInstallBtn; inst.hidden = false;
  });
  inst.addEventListener("click", function () {
    if (!offer) return;
    var o = offer; offer = null; inst.hidden = true;
    o.prompt();
    var signed = signIn();
    o.userChoice.then(function (c) {
      signed.then(function (ok) {
        if (!ok) return;
        if (c.outcome === "accepted") { done(); say("cxInstalled"); } else location.replace("/");
      });
    });
  });
})();
</script>
</body>
</html>
