<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>Copius — Ingredient Dictionary · Dictionnaire des ingrédients</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" sizes="192x192" href="/icons/icon-192.png">
<meta name="description" content="1 835 ingredients, 135 techniques, 45 bases and 81 chefs — origin, season, flavour, price and a kitchen note for each, in English and French.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Copius">
<meta property="og:title" content="Copius — the atlas">
<meta property="og:description" content="1 835 ingredients, 135 techniques, 45 bases and 81 chefs — origin, season, flavour, price and a kitchen note for each, in English and French.">
<meta property="og:url" content="https://copius.fr/atlas.html">
<meta property="og:image" content="https://copius.fr/og/copius.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/style.css?v=192">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F7F6F1">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Copius">

  <script>
    /* Applied before first paint so a dark visitor never sees a white flash. */
    (function () {
      try {
        var t = localStorage.getItem("copius-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>

<header class="site-head">
  <div class="brand">
    <div class="brand-mark"><svg class="brand-logo" viewBox="0 0 96 96" width="30" height="30" aria-hidden="true"><path class="bl-f" d="M52 24C30 32 16 52 20 66c2 9 12 12 17 6 4-5 0-12-5-10 4-12 16-22 34-24Z"/><path class="bl-s" d="M52 24c9 4 14 11 14 20"/><circle class="bl-d" cx="62" cy="20" r="7"/><circle class="bl-d" cx="75" cy="30" r="5.5"/><circle class="bl-d" cx="52" cy="11" r="4.5"/></svg></div>
    <div class="brand-text">
      <h1>Copius</h1>
      <p id="tagline"></p>
    </div>
  </div>
  <div class="head-tools">
    <input id="search" type="search" autocomplete="off">
    <button id="createBtn" class="create-btn" type="button"></button>
    <a class="ig-link" href="https://instagram.com/copius.fr" rel="me noopener" target="_blank" data-i18n-aria="igLink"><svg class="ig" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1.2" class="ig-dot"/></svg></a>
      <button id="themeBtn" class="theme-btn" type="button" data-i18n-aria="ariaTheme"></button>
    <div class="lang-toggle" id="langToggle" role="group" aria-label="Language / Langue">
      <button id="lang-en" type="button">EN</button><button id="lang-fr" type="button">FR</button>
    </div>
  </div>
</header>

<main>
  <div class="view-row">
    <nav class="view-tabs" id="viewTabs" role="tablist" data-i18n-aria="ariaViews">
      <button id="tabAtlas" class="view-tab" type="button" role="tab" aria-controls="atlasView"></button>
      <button id="tabChefs" class="view-tab" type="button" role="tab" aria-controls="chefsView"></button>
      <button id="tabTech" class="view-tab" type="button" role="tab" aria-controls="techView"></button>
      <button id="tabBases" class="view-tab" type="button" role="tab" aria-controls="basesView"></button>
      <button id="tabLab" class="view-tab" type="button" role="tab" aria-controls="labView"></button>
    </nav>
    <!-- Not inside the tablist: it chooses a version, not a view, and a role=tablist
         holding a non-tab is a lie to assistive tech. -->
    <div class="lang-toggle tier-toggle" id="tierToggle" role="group" data-i18n-aria="ariaTier">
      <button id="tier-free" type="button"></button><button id="tier-full" type="button"></button>
    </div>
  </div>

  <div id="atlasView" role="tabpanel">
  <p id="tierNote" class="tier-note"></p>
  <section id="daily" class="daily" role="button" tabindex="0"></section>

  <nav id="cats" class="cats" data-i18n-aria="ariaFamilies"></nav>

  <div class="toolbar">
    <label class="check"><input type="checkbox" id="seasonNow"><span id="seasonNowLbl"></span></label>
    <a id="seasonLink" class="season-link" href="season/"></a>
    <label class="check"><input type="checkbox" id="favsOnly"><span id="favsOnlyLbl"></span></label>
    <label class="check"><input type="checkbox" id="rareOnly"><span id="rareOnlyLbl"></span></label>
    <label class="check"><input type="checkbox" id="luxeOnly"><span id="luxeOnlyLbl"></span></label>
    <label class="check"><input type="checkbox" id="signOnly"><span id="signOnlyLbl"></span></label>
    <select id="priceBand" data-i18n-aria="priceLabel"></select>
    <select id="flavour" data-i18n-aria="ariaTaste"></select>
    <select id="sort" data-i18n-aria="ariaSort"></select>
    <button id="random" class="linkish" type="button"></button>
    <span id="stats" class="stats" aria-live="polite"></span>
  </div>

  <section id="grid" class="grid"></section>
  <p id="empty" class="empty" hidden></p>

  <section class="creations" id="creationsSec">
    <h2 id="creationsTitle"></h2>
    <p id="creationsHint" class="muted"></p>
    <div id="creationsGrid" class="trio-grid"></div>
  </section>
  </div>



  <div id="labView" role="tabpanel" hidden>
  <section class="lab" id="lab">
    <h2 id="labTitle"></h2>
    <p id="labHint" class="muted"></p>

    <!-- Two ingredients, or a whole plate. The same recorded accords answer both. -->
    <div class="lang-toggle lab-modes" id="labModes" role="group" data-i18n-aria="ariaLabMode">
      <button id="labModePair" type="button"></button><button id="labModePlate" type="button"></button>
    </div>

    <div id="labPair">
      <!-- Type, see, click, as in the plate: two dropdowns of 1 839 names each
           meant scrolling past every fruit to reach a duck. -->
      <div class="lab-row">
        <div class="plate-find">
          <input type="search" id="labA" autocomplete="off" role="combobox"
                 aria-expanded="false" aria-controls="labAResults" aria-autocomplete="list">
          <ul id="labAResults" class="plate-results" role="listbox" hidden></ul>
        </div>
        <span class="lab-x" aria-hidden="true">×</span>
        <div class="plate-find">
          <input type="search" id="labB" autocomplete="off" role="combobox"
                 aria-expanded="false" aria-controls="labBResults" aria-autocomplete="list">
          <ul id="labBResults" class="plate-results" role="listbox" hidden></ul>
        </div>
      </div>
      <p id="labCount" class="muted plate-count"></p>
      <div id="labResult" class="lab-result" aria-live="polite"></div>
    </div>

    <div id="labPlate" hidden>
      <div class="lang-toggle plate-modes" id="plateModes" role="group" data-i18n-aria="ariaPlateMode">
        <button id="plateGuided" type="button"></button><button id="plateFree" type="button"></button>
      </div>
      <p id="plateHint" class="muted plate-hint"></p>
      <div id="plateTplRow" class="plate-tpl-row"><select id="plateTpl"></select></div>

      <!-- Type, see, click. The search used to filter a separate dropdown you
           then had to open yourself, which meant four moves to add one thing. -->
      <div class="plate-add">
        <select id="plateRole"></select>
        <div class="plate-find">
          <input type="search" id="plateSearch" autocomplete="off" role="combobox"
                 aria-expanded="false" aria-controls="plateResults" aria-autocomplete="list">
          <ul id="plateResults" class="plate-results" role="listbox" hidden></ul>
        </div>
      </div>
      <p id="plateCount" class="muted plate-count"></p>

      <div id="plateSlots" class="plate-slots"></div>
      <div id="plateItems" class="plate-items"></div>
      <div id="plateVerdict" class="lab-result"></div>
    </div>
  </section>

  <section class="trios" id="triosSec">
    <h2 id="triosTitle"></h2>
    <div id="triosGrid" class="trio-grid"></div>
  </section>
  </div>

  <div id="chefsView" role="tabpanel" hidden>
    <div class="chefs-head">
      <h2 id="chefsTitle"></h2>
      <p id="chefsHint" class="muted"></p>
    </div>
    <div class="chef-filters">
      <input id="chefSearch" type="search" autocomplete="off">
      <select id="chefGender" data-i18n-aria="ariaGender"></select>
      <select id="chefStars" data-i18n-aria="ariaStars"></select>
      <select id="chefCountry" data-i18n-aria="ariaCountry"></select>
      <select id="chefEra" data-i18n-aria="ariaEra"></select>
      <button id="chefReset" class="linkish" type="button"></button>
      <span id="chefCount" class="stats"></span>
    </div>
    <div id="chefsTimeline" class="timeline"></div>
  </div>

  <div id="techView" role="tabpanel" hidden>
    <div class="chefs-head">
      <h2 id="techTitle"></h2>
      <p id="techHint" class="muted"></p>
    </div>
    <div class="chef-filters">
      <input id="techSearch" type="search" autocomplete="off">
      <select id="techGroup" data-i18n-aria="ariaGroup"></select>
      <span id="techCount" class="stats"></span>
    </div>
    <div id="techList" class="tech-list"></div>
  </div>

  <div id="basesView" role="tabpanel" hidden>
    <div class="chefs-head">
      <h2 id="basesTitle"></h2>
      <p id="basesHint" class="muted"></p>
    </div>
    <div class="chef-filters">
      <input id="baseSearch" type="search" autocomplete="off">
      <select id="baseGroup" data-i18n-aria="ariaGroup"></select>
      <span id="baseCount" class="stats"></span>
    </div>
    <div id="baseList" class="base-list"></div>
  </div>
</main>

<footer class="site-foot"><span id="footNote"></span><span class="foot-contact"><a href="about/" id="aboutLink"></a></span><span class="foot-contact"><a href="confidentialite/" id="privacyLink"></a></span><span id="contactLine" class="foot-contact"></span><span id="disclaimer" class="foot-legal"></span></footer>

<div id="createOverlay" class="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="createTitle" id="createModal"></div>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modal">
    <div class="modal-bar">
      <button id="backBtn" class="ghost" type="button" data-i18n-aria="back" data-i18n-title="back" hidden>&#8592;</button>
      <button id="closeBtn" class="ghost" type="button" data-i18n-aria="close" data-i18n-title="close">&#10005;</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<input type="file" id="photoFile" accept="image/*" hidden>

<script src="js/tier.js?v=192"></script>
<script src="js/i18n.js?v=192"></script>
<script src="js/photos.js?v=192"></script>
  <script src="js/data-cellar.js?v=192"></script>
  <script src="js/data-condiments.js?v=192"></script>
  <script src="js/data-cuts.js?v=192"></script>
  <script src="js/data-dairy.js?v=192"></script>
  <script src="js/data-flowers.js?v=192"></script>
  <script src="js/data-fats.js?v=192"></script>
  <script src="js/data-fruits.js?v=192"></script>
  <script src="js/data-grains.js?v=192"></script>
  <script src="js/data-herbs.js?v=192"></script>
  <script src="js/data-infusions.js?v=192"></script>
  <script src="js/data-legumes.js?v=192"></script>
  <script src="js/data-meat.js?v=192"></script>
  <script src="js/data-mushrooms.js?v=192"></script>
  <script src="js/data-nuts.js?v=192"></script>
  <script src="js/data-roe.js?v=192"></script>
  <script src="js/data-seafood.js?v=192"></script>
  <script src="js/data-seaweed.js?v=192"></script>
  <script src="js/data-shellfish.js?v=192"></script>
  <script src="js/data-spices.js?v=192"></script>
  <script src="js/data-sweet.js?v=192"></script>
  <script src="js/data-texture.js?v=192"></script>
  <script src="js/data-vegetables.js?v=192"></script>
<script src="js/data-bases.js?v=192"></script>
  <script src="js/data-techniques.js?v=192"></script>
  <script src="js/data-trees.js?v=192"></script>
<script src="js/data-chefs.js?v=192"></script>
<script src="js/trios.js?v=192"></script>
<script src="js/trios-gastronomy.js?v=192"></script>
<script src="js/trios-premium.js?v=192"></script>
<script src="js/plate.js?v=192"></script>
<script src="js/app.js?v=192"></script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("service-worker.js", { scope: "./" });
  });

</script>
</body>
</html>
