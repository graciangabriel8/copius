name: Reels to Instagram

# Posts the reel social/reels.json schedules for the day, if there is one. The
# video is rendered in advance (music included: the API cannot reach Instagram's
# music library) and committed under social/reels/, and Instagram fetches it
# from the site: video_url is the only reel upload the Instagram Login API
# documents. So this job, like the daily card, only calls the API.
on:
  schedule:
    # UTC, and early on purpose: the job holds until 12:00 in Paris, whatever
    # the cron and the October change do. Noon since 3 Oct 2026: the salt reel,
    # posted at 12:04 by hand, outdid the 09:43 and 17:13 ones; and the card
    # posts at 17:00, so the two never land together.
    # GitHub starts these runs 3 to 6 h 36 late on this repository (see
    # daily-instagram.yml): a 12:05 cron began at 17:58 UTC on 30 Sept, and on
    # 1 Oct had not begun by 15:10. Three early starts, as for the card: one
    # more than 5 h 35 before noon steps aside, the first within reach waits,
    # the later ones queue behind it and find the reel up. On time, the 06:05
    # start posts, summer and winter; up to 8 h late, the 02:05 or 04:05 one
    # does, at most 5 min after noon. Off the top of the hour, which GitHub
    # delays most.
    - cron: "5 2 * * *"
    - cron: "5 4 * * *"
    - cron: "5 6 * * *"
  workflow_dispatch:          # by hand: posts the day's reel, or a past day's, at once
    inputs:
      date:
        description: "Post the reel scheduled for this date (YYYY-MM-DD, today or earlier). Empty: today."
        required: false

concurrency:
  # Scheduled starts queue in one lane; a run started by hand has its own, so
  # it never waits hours behind a holding start or gets cancelled by the next
  # one. The duplicate guards cover a manual run overlapping a scheduled one.
  group: reels-instagram-${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the day's reel
        id: pick
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          TODAY="$(TZ=Europe/Paris date +%F)"
          DATE="${INPUT_DATE:-$TODAY}"
          case "$DATE" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "::error::date must be YYYY-MM-DD, got '$DATE'"; exit 1 ;;
          esac
          # A later day's reel posted by hand would go out again on its own day:
          # the duplicate guard below knows what is up, not what is scheduled.
          if [ "$DATE" \> "$TODAY" ]; then
            echo "::error::$DATE is after today ($TODAY) — change its date in social/reels.json instead"; exit 1
          fi
          # file, id, cover and the number of reels still to come, from one read
          # of the file; an assignment, so a failing read stops the step under set -e
          OUT="$(python3 - "$DATE" <<'PY'
          import json, sys
          d = sys.argv[1]
          rs = json.load(open("social/reels.json"))["reels"]
          hit = [r for r in rs if r["date"] == d]
          if len(hit) > 1:
              sys.exit("two reels scheduled on " + d)
          left = sum(1 for r in rs if r["date"] > d)
          h = hit[0] if hit else {}
          print(h.get("file", "-"), h.get("id", "-"), h.get("cover", "-"), left)
          PY
          )"
          read -r FILE ID COVER LEFT <<< "$OUT"
          echo "day $DATE: ${FILE} (${ID}, cover ${COVER}); $LEFT reel(s) scheduled after it"
          if [ "$LEFT" -lt 3 ]; then
            echo "::warning::only $LEFT reel(s) scheduled after $DATE — render more and add them to social/reels.json"
          fi
          if [ "$FILE" = "-" ]; then
            echo "::notice::no reel scheduled on $DATE"; exit 0
          fi
          test -f "$FILE" || { echo "::error::$FILE is scheduled on $DATE but is not in the repository"; exit 1; }
          if [ "$COVER" != "-" ]; then
            test -f "$COVER" || { echo "::error::cover $COVER is scheduled on $DATE but is not in the repository"; exit 1; }
          fi
          python3 tools/make-card.py --caption-id "$ID" >/dev/null   # fails now, not after the wait
          {
            echo "file=$FILE"
            echo "id=$ID"
            echo "bytes=$(wc -c < "$FILE" | tr -d ' ')"
            if [ "$COVER" != "-" ]; then
              echo "cover=$COVER"
              echo "cover_bytes=$(wc -c < "$COVER" | tr -d ' ')"
            fi
          } >> "$GITHUB_OUTPUT"

      # 12:00 in Paris for a scheduled run; a run started by hand posts at once.
      - name: Hold until 12:00 in Paris
        id: hold
        if: github.event_name == 'schedule' && steps.pick.outputs.file != ''
        run: |
          set -euo pipefail
          target="$(TZ=Europe/Paris date -d 'today 12:00' +%s)"
          now="$(date +%s)"
          wait=$(( target - now ))
          echo "now      $(TZ=Europe/Paris date -d "@$now" '+%F %H:%M %Z')"
          echo "posting  $(TZ=Europe/Paris date -d "@$target" '+%F %H:%M %Z')"
          if [ "$wait" -le 0 ]; then
            echo "::warning::started at or after 12:00 Paris — posting now, $(( -wait / 60 )) min late"
            exit 0
          fi
          # Too early to wait inside GitHub's 6 h job limit: step aside, a later
          # start of the three posts the reel. Publish reads skip.
          if [ "$wait" -gt 20100 ]; then
            echo "::notice::$(( wait / 60 )) min until 12:00 Paris — too early to wait; a later start posts the reel"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "waiting $(( wait / 60 )) min"
          sleep "$wait"

      - name: Publish
        if: steps.pick.outputs.file != '' && steps.hold.outputs.skip != '1'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FILE: ${{ steps.pick.outputs.file }}
          ID: ${{ steps.pick.outputs.id }}
          BYTES: ${{ steps.pick.outputs.bytes }}
          COVER: ${{ steps.pick.outputs.cover }}
          COVER_BYTES: ${{ steps.pick.outputs.cover_bytes }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          : "${IG_USER_ID:?set the IG_USER_ID repository secret}"
          : "${IG_ACCESS_TOKEN:?set the IG_ACCESS_TOKEN repository secret}"
          URL="https://copius.fr/$FILE"
          CAPTION="$(python3 tools/make-card.py --caption-id "$ID")"
          test -n "$CAPTION" || { echo "::error::empty caption for $ID"; exit 1; }

          # 0. are the video and its cover live, and are they these? Instagram
          # fetches both itself and answers a missing or half-deployed file only
          # with a container ERROR, so ask first: status, type and size against
          # the committed files.
          live() {  # url, content type, committed bytes
            # "|" between fields: a content type can hold a space ("; charset=")
            IFS='|' read -r CODE TYPE SIZE <<< "$(curl -sS -o /dev/null -w '%{http_code}|%{content_type}|%{size_download}' --max-time 120 "$1")"
            echo "site: $CODE, ${TYPE:-no type}, $SIZE bytes for $1 (committed: $3 bytes)"
            if [ "$CODE" != "200" ] || [ "${TYPE%%;*}" != "$2" ] || [ "$SIZE" != "$3" ]; then
              echo "::error::$1 is not the committed file yet (deploy pending?) — nothing posted"; exit 1
            fi
          }
          live "$URL" video/mp4 "$BYTES"
          COVER_ARG=()
          if [ -n "$COVER" ]; then
            # The grid shows it cropped to its middle 3:4; the reel's own frames
            # are the fallback when a day has no cover.
            live "https://copius.fr/$COVER" image/jpeg "$COVER_BYTES"
            COVER_ARG=(--data-urlencode "cover_url=https://copius.fr/$COVER")
          fi

          # 1. is this reel already up, or has a reel gone out today? A manual run
          # plus the cron, or a re-run for a past day, would otherwise post twice.
          # "This reel" is a reel with the same caption among the last 50 (spaces
          # compared loosely, in case Instagram rewrites no-break ones) — so a
          # second reel closing on the same ingredient needs its own caption.
          # "Today" is the Paris day. Reels only: the 17:00 card is a carousel. An
          # unreadable answer gives an empty list and the reel goes out: a missed
          # reel is invisible, a duplicate is not.
          SEEN="$(curl -sS -G --max-time 60 "https://graph.instagram.com/v23.0/$IG_USER_ID/media" \
            --data-urlencode "fields=timestamp,media_product_type,caption" --data-urlencode "limit=50" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN" \
            | python3 -c 'import sys, json, datetime, zoneinfo
          try: d = json.load(sys.stdin).get("data") or []
          except ValueError: d = []
          flat = lambda s: " ".join((s or "").split())
          paris = lambda t: datetime.datetime.strptime(t, "%Y-%m-%dT%H:%M:%S%z").astimezone(zoneinfo.ZoneInfo("Europe/Paris")).date().isoformat()
          reels = [m for m in d if m.get("media_product_type") == "REELS"]
          if any(flat(m.get("caption")) == flat(sys.argv[1]) for m in reels): print("this reel")
          elif any(m.get("timestamp") and paris(m["timestamp"]) == sys.argv[2] for m in reels): print("a reel today")
          else: print("")' "$CAPTION" "$(TZ=Europe/Paris date +%F)")"
          if [ "$SEEN" = "a reel today" ] && [ "$EVENT" = "schedule" ]; then
            # the day's own reel is skipped, and its date then lies in the past
            echo "::warning::$ID ($FILE) not posted: another reel went out today — dispatch it by hand tomorrow, or move its date in social/reels.json"; exit 0
          fi
          if [ -n "$SEEN" ]; then
            echo "::notice::already up: $SEEN — nothing to do"; exit 0
          fi
          echo "not posted yet"

          # 2. the container: Instagram downloads the video from the site.
          jid() { printf '%s' "$1" | python3 -c 'import sys,json
          try: print(json.load(sys.stdin).get("id",""))
          except ValueError: print("")'; }
          CREATE="$(curl -sS -X POST --max-time 120 "https://graph.instagram.com/v23.0/$IG_USER_ID/media" \
            -d "media_type=REELS" \
            --data-urlencode "video_url=$URL" \
            --data-urlencode "caption=$CAPTION" \
            ${COVER_ARG[@]+"${COVER_ARG[@]}"} \
            -d "share_to_feed=true" \
            -d "access_token=$IG_ACCESS_TOKEN")"
          CID="$(jid "$CREATE")"
          if [ -z "$CID" ]; then echo "::error::container failed: $(printf '%s' "$CREATE" | head -c 400)"; exit 1; fi

          # 3. wait for Instagram to fetch and process the video: once a minute,
          # five minutes at most (Meta's guidance) — checks at 0 to 5 minutes.
          STATUS=""
          for i in 1 2 3 4 5 6; do
            [ "$i" = 1 ] || sleep 60
            STATUS="$(curl -sS -G --max-time 60 "https://graph.instagram.com/v23.0/$CID" \
              --data-urlencode "fields=status_code" \
              --data-urlencode "access_token=$IG_ACCESS_TOKEN" \
              | python3 -c 'import sys,json
          try: print(json.load(sys.stdin).get("status_code",""))
          except ValueError: print("")')"
            echo "container $CID: ${STATUS:-<no status>} (check $i/6)"
            case "$STATUS" in
              FINISHED) break ;;
              ERROR|EXPIRED) echo "::error::container ended as $STATUS"; exit 1 ;;
            esac
          done
          if [ "$STATUS" != "FINISHED" ]; then
            echo "::error::container still ${STATUS:-without status} after five minutes"; exit 1
          fi

          # 4. publish
          PUB="$(curl -sS -X POST --max-time 120 "https://graph.instagram.com/v23.0/$IG_USER_ID/media_publish" \
            -d "creation_id=$CID" -d "access_token=$IG_ACCESS_TOKEN")"
          printf '%s' "$PUB" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("published",d["id"]) if d.get("id") else sys.exit("publish failed: "+json.dumps(d)[:400])'
          # A queued start follows within seconds: hold the group two minutes so
          # its guard reads a media list that already shows this post.
          if [ "${{ github.event_name }}" = "schedule" ]; then sleep 120; fi
