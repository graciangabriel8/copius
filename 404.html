<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Copius a déménagé · Copius has moved</title>
<meta name="robots" content="noindex">
<script>
var p = location.pathname, pre = '/copius/';
var rest = p.indexOf(pre) === 0 ? p.slice(pre.length) : "";
location.replace('https://copius.fr/' + rest + location.search + location.hash);
</script>
</head>
<body><p>Copius est maintenant à <a href="https://copius.fr/">https://copius.fr/</a>. · Copius is now at <a href="https://copius.fr/">https://copius.fr/</a>.</p></body>
</html>
