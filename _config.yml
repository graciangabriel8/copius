# GitHub Pages builds this repo with Jekyll and honours this list: the tooling,
# the developer docs and the plans stay off the published site. brand/ is
# served on purpose (robots.txt and the profile PDF point at it).
exclude:
  - tools
  - docs
  - PLAN-1500.md
  - PLAN-ingredients-500.md
  - ROADMAP.md
  - .github
  # The full version: every source file of tools/sources.txt but
  # js/data-techniques.js (techniques are free, and the atlas loads that file as
  # is). The public atlas loads the generated js/free.js instead. Listed by path,
  # since js/ also holds the published scripts; tools/validate.js fails on a
  # source missing here.
  - js/data-cellar.js
  - js/data-condiments.js
