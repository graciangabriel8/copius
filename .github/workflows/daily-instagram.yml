name: Daily ingredient to Instagram

# Posts the same ingredient the website shows that day. The picture and the
# caption are pre-built and committed, so this job only calls the API.
on:
  schedule:
    - cron: "0 8 * * *"      # 08:00 UTC — 10:00 Paris in summer, 09:00 in winter
  workflow_dispatch:          # lets you run it by hand from the Actions tab

concurrency:
  group: daily-instagram      # never two posts at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out today's ingredient
        id: pick
        run: |
          set -euo pipefail
          # The date is pinned once and reused, so the picture and the caption
          # cannot come from two different days if the job straddles midnight.
          DATE="$(date -u +%F)"
          ID="$(python3 tools/make-card.py --today-id)"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Today: $ID ($DATE)"
          test -f "social/$ID.jpg" || { echo "::error::social/$ID.jpg is missing — the card window has run out. Run: sh tools/build-social.sh 400 && git add social && git commit && git push"; exit 1; }
          # warn while there is still time to rebuild
          LEFT=$(ls -1 social/*.jpg | wc -l | tr -d " ")
          # An `if`, not `[ ] && echo` — under set -e a false test makes the
          # && chain return non-zero, and as the step's last command that
          # fails the whole job. The warning fired by not firing.
          if [ "$LEFT" -lt 40 ]; then
            echo "::warning::only $LEFT cards left in the window — rerun tools/build-social.sh"
          fi

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ID: ${{ steps.pick.outputs.id }}
          DATE: ${{ steps.pick.outputs.date }}
        run: |
          set -euo pipefail
          : "${IG_USER_ID:?set the IG_USER_ID repository secret}"
          : "${IG_ACCESS_TOKEN:?set the IG_ACCESS_TOKEN repository secret}"
          IMG="https://copius.fr/social/$ID.jpg"
          # Derived here, not read from a committed copy: a change to caption()
          # then reaches the next post without a regeneration step to forget.
          CAPTION="$(python3 tools/make-card.py --caption "$DATE")"
          test -n "$CAPTION" || { echo "::error::empty caption for $ID"; exit 1; }

          # 0. has today already gone out? The job posts whatever the date picks,
          # every time it runs, so a manual run plus the cron would put the same
          # card up twice on a public profile. Ask Instagram for the newest post
          # and compare dates. An unreadable answer yields an empty string, which
          # never equals $DATE, so the day's post still goes out — a missed day is
          # invisible and this check exists only to stop a visible duplicate.
          LATEST="$(curl -sS -G "https://graph.instagram.com/v23.0/$IG_USER_ID/media" \
            --data-urlencode "fields=timestamp" --data-urlencode "limit=1" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN" \
            | python3 -c 'import sys,json; d=(json.load(sys.stdin).get("data") or [{}]); print((d[0].get("timestamp") or "")[:10])')"
          echo "last post: ${LATEST:-<none>} | today: $DATE"
          if [ "$LATEST" = "$DATE" ]; then
            echo "::notice::already posted today ($DATE) — nothing to do"
            exit 0
          fi

          # 1. container
          CREATE="$(curl -sS -X POST "https://graph.instagram.com/v23.0/$IG_USER_ID/media" \
            --data-urlencode "image_url=$IMG" \
            --data-urlencode "caption=$CAPTION" \
            -d "access_token=$IG_ACCESS_TOKEN")"
          CID="$(printf '%s' "$CREATE" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))')"
          if [ -z "$CID" ]; then echo "::error::container failed: $(printf '%s' "$CREATE" | head -c 400)"; exit 1; fi

          # 2. wait for Instagram to finish fetching the image.
          # Publishing straight after creating the container is a race: the container
          # exists before the media is ready, and media_publish then answers 9007
          # "Media ID is not available". Meta's guidance is to query the container
          # once a minute for at most five.
          STATUS=""
          for i in 1 2 3 4 5; do
            STATUS="$(curl -sS -G "https://graph.instagram.com/v23.0/$CID" \
              --data-urlencode "fields=status_code" \
              --data-urlencode "access_token=$IG_ACCESS_TOKEN" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status_code",""))')"
            echo "container $CID: ${STATUS:-<no status>} (check $i/5)"
            case "$STATUS" in
              FINISHED) break ;;
              ERROR|EXPIRED) echo "::error::container ended as $STATUS"; exit 1 ;;
            esac
            [ "$i" = 5 ] || sleep 60
          done
          if [ "$STATUS" != "FINISHED" ]; then
            echo "::error::container still $STATUS after five minutes"; exit 1
          fi

          # 3. publish
          PUB="$(curl -sS -X POST "https://graph.instagram.com/v23.0/$IG_USER_ID/media_publish" \
            -d "creation_id=$CID" -d "access_token=$IG_ACCESS_TOKEN")"
          printf '%s' "$PUB" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("published",d["id"]) if d.get("id") else sys.exit("publish failed: "+json.dumps(d)[:400])'

  # Long-lived tokens die after 60 days and cannot be revived. This refreshes
  # weekly and writes the new one straight back into the repository secret.
  refresh-token:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Refresh the access token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::SECRETS_PAT not set — refresh the token by hand before it expires"; exit 0
          fi
          NEW="$(curl -sS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_ACCESS_TOKEN" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("access_token",""))')"
          if [ -z "$NEW" ]; then echo "::error::refresh failed — the token may be within 24h of issue, or already dead"; exit 1; fi
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" --body "$NEW"
          echo "token refreshed (value never printed)"
