    placeArt(draw.strawberry, sp, 1, 2);
    C.partners.forEach(function (id, k) {
      var c = chipAt[k], seat = { x: c.x + 45, y: c.y + 44, r: 0, s: 70 };
      var moves = [{ a: C.chips[k][0], b: C.chips[k][1], to: seat }], op = 1;
      if (chosen(id)) {
        var j = C.plate.indexOf(id);
        moves.push({ a: C.plateIn[j][0], b: C.plateIn[j][1], to: PLATE_AT[j] }, { a: C.row[0], b: C.row[1], to: endAt(id) });
      } else if (t >= C.rowRise[0]) {
        var e = endAt(id), u = ease(span(t, C.rowRise[0], C.rowRise[1]));
        placeArt(draw[id], { x: e.x, y: e.y + 20 * (1 - u), r: 0, s: 100, fly: 0 }, u, 2);
        return;
      } else op = 1 - listOut;
      placeArt(draw[id], pose(t, function (t) { return drift(MESS_D[id], t); }, moves), op, 2);
    });

    // The chips: each card comes as its drawing leaves the mess, and bounces when it lands.
    chips.forEach(function (c, k) {
      var a = C.chips[k][0], land = C.chips[k][1], inn = out3(span(t, a, a + .25));
      var keep = chosen(C.partners[k]) ? 1 - ease(span(t, C.plateIn[0][0], C.plateIn[0][0] + .3)) : 1 - listOut;
      var sc = (.9 + .1 * inn) * (1 + .04 * bump(t, land, .15)) * (chosen(C.partners[k]) ? 1 : 1 - .08 * listOut);
      c.style.opacity = String(inn * keep);
      c.style.transform = "scale(" + sc.toFixed(4) + ")";
    });
    var hn = ease(span(t, C.head[1] - .1, C.head[1] + .2)) * (1 - listOut);
    $("headName").style.opacity = String(hn);
    $("headName").style.transform = "translateY(" + (16 * (1 - ease(span(t, C.head[1] - .1, C.head[1] + .2)))).toFixed(2) + "px)";

    // The letters: five fly home with the first five chips; the S waits, then lands on the verdict.
    var nod = 1 + .05 * bump(t, C.hit, .3);
    letters.forEach(function (el, i) {
      var h = home[i], H = { x: h.x, y: h.y, r: 0, s: 1 }, p, settled;
      if (i < 5) {
        p = pose(t, function (t) { return drift(MESS_L[i], t); }, [{ a: C.chips[i][0], b: C.chips[i][1], to: H }]);
        settled = out3(span(t, C.chips[i][0], C.chips[i][1]));
      } else {
        p = pose(t, function (t) { return drift(MESS_L[5], t); },
          [{ a: C.sWait[0], b: C.sWait[1], to: function (t) { return drift(WAIT, t); } }, { a: C.sHome[0], b: C.sHome[1], to: H }]);
        p.s *= 1 + .1 * (bump(t, C.sPulse[0], .25) + bump(t, C.sPulse[1], .25));
        settled = out3(span(t, C.sHome[0], C.sHome[1]));
      }
      el.style.transform = "translate(" + (p.x - h.x).toFixed(2) + "px," + (p.y - h.y).toFixed(2) + "px) rotate(" +
        p.r.toFixed(2) + "deg) scale(" + (p.s * nod).toFixed(4) + ")";
      el.style.zIndex = p.fly ? "7" : "4";
      el.style.filter = p.fly ? "blur(" + (2.6 * Math.sin(Math.PI * p.fly)).toFixed(2) + "px)" : "none";
      // Loose letters float with a shadow; a letter in its place lies flat, as in the header.
      el.style.textShadow = "0 14px 26px rgba(30,33,26," + (.16 * (1 - settled)).toFixed(3) + ")";
    });

    // The question leaves as the list comes.
    var hk = ease(span(t, C.hookOut[0], C.hookOut[1]));
    $("hook").style.opacity = String(1 - hk); $("hook").style.transform = "translateY(" + (-12 * hk) + "px)";

    // The finger: in, a tap on the field, out; back later for the lab button.
    function finger(f, x, y) {
      var fin = out3(span(t, f[0], f[1])), fout = in2(span(t, f[3], f[4]));
      return { x: 1010 + (x - 1010) * fin + (1080 - x) * fout, y: 1700 + (y - 1700) * fin + (1780 - y) * fout,
               op: span(t, f[0], f[0] + .15) * (1 - span(t, f[4] - .2, f[4])), press: 1 - .16 * bump(t, f[2] - .05, .22) };
    }
    var f1 = finger(C.finger1, 690, 1393), f2 = finger(C.finger2, 540, 1393), f = t < C.finger2[0] ? f1 : f2;
    $("finger").style.transform = "translate(" + f.x.toFixed(2) + "px," + f.y.toFixed(2) + "px) scale(" + f.press.toFixed(4) + ")";
    $("finger").style.opacity = String(f.op);
    [[$("rip1"), C.finger1[2], 690], [$("rip2"), C.finger2[2], 540]].forEach(function (r) {
      var rp = span(t, r[1], r[1] + .4);
      r[0].style.transform = "translate(" + r[2] + "px,1393px) scale(" + (.6 + 1.5 * out3(rp)).toFixed(4) + ")";
      r[0].style.opacity = rp > 0 && rp < 1 ? String(.9 * (1 - rp)) : "0";
    });

    // The field: its placeholder until the tap, then focus, then the word, key by key.
    var tap = C.finger1[2], focus = span(t, tap, tap + .15);
    $("pill").style.borderColor = focus > 0 ? "#6A6E5F" : "";
    $("pill").style.boxShadow = "0 0 0 " + (8 * focus).toFixed(1) + "px #E3E8D6";
    var keys = C.keys.filter(function (k) { return t >= k; }).length;
    $("ph").textContent = t < tap ? PH : "";
    $("typed").textContent = WORD.slice(0, keys);
    $("caret").style.opacity = t < tap ? "0" : (t - tap) % 1 < .55 || (keys > 0 && keys < 6) ? "1" : "0";
    var bt = ease(span(t, C.button[0], C.button[1]));
    $("pill").style.opacity = String(1 - bt);
    $("btn").style.opacity = String(bt * (1 - ease(span(t, C.finger2[2], C.finger2[2] + .3))));
    $("btn").style.transform = "scale(" + (1 - .03 * bump(t, C.finger2[2] - .05, .22)).toFixed(4) + ")";

    // The lab: three cards under the plate, then the score counting to the engine's verdict.
    pcards.forEach(function (c, k) {
      var u = ease(span(t, C.plateIn[k][0], C.plateIn[k][0] + .3)) * (1 - labOut);
      c.style.opacity = String(u);
      c.style.transform = "translateY(" + (16 * labOut).toFixed(2) + "px) scale(" + (1 + .03 * bump(t, C.plateIn[k][1], .15)).toFixed(4) + ")";
      c.firstChild.style.opacity = String(ease(span(t, C.plateIn[k][1] - .1, C.plateIn[k][1] + .15)));
    });
    var si = ease(span(t, C.scoreIn[0], C.scoreIn[1]));
    $("score").style.opacity = String(si * (1 - labOut));
    $("score").style.transform = "translateY(" + (16 * (1 - si) + 16 * labOut).toFixed(2) + "px)";
    var cnt = out3(span(t, C.count[0], C.count[1]));
    // Rounded down, so the verdict's own number shows only as the S lands on it.
    $("snum").firstChild.textContent = String(Math.floor(C.score * cnt + 1e-9));
    $("snum").style.transform = "scale(" + (1 + .15 * (1 - out3(span(t, C.hit, C.hit + .2))) * (t >= C.hit ? 1 : 0)).toFixed(4) + ")";
    $("sfill").style.width = (C.score * cnt).toFixed(2) + "%";
    var tg = span(t, C.hit, C.hit + .2);
    $("sband").style.opacity = String(t >= C.hit ? 1 : 0);
    $("sband").style.transform = "scale(" + (1 + .2 * (1 - out3(tg))).toFixed(4) + ")";

    // The end: as the lab leaves, the word settles to the middle of the frame; the leaf
    // over it, the address and the seven under it.
    $("row").style.transform = "translateY(" + (150 * ease(span(t, C.settle[0], C.settle[1]))).toFixed(2) + "px)";
    var lf = span(t, C.leaf[0], C.leaf[1]);
    $("leaf").style.opacity = String(ease(lf)); $("leaf").style.transform = "scale(" + (.6 + .4 * back(lf, 1.6)).toFixed(4) + ")";
    var ur = ease(span(t, C.url[0], C.url[1]));
    $("url").style.opacity = String(ur); $("url").style.transform = "translateY(" + (16 * (1 - ur)).toFixed(2) + "px)";
    return true;
  };
})();
</script>
</body>
</html>
