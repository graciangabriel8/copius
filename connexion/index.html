<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("copius-theme"),r=document.documentElement;if(t==="dark"||t==="light"){r.setAttribute("data-theme",t);var m=document.createElement("meta");m.name="theme-color";m.content=t==="dark"?"#14160F":"#F7F6F1";document.head.appendChild(m)}}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Connexion · Sign in — Copius</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" sizes="192x192" href="/icons/icon-192.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F6F1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14160F">
<link rel="stylesheet" href="../css/page.css?v=215">
<style>
  .cx{margin:10px 0 0;padding:11px 20px;border-radius:999px;border:1px solid var(--ink);
    background:var(--ink);color:var(--bg);font:600 15px/1.2 var(--sans);cursor:pointer}
  .cx:hover{opacity:.85}
  .cx:disabled{opacity:.5;cursor:default}
  .cx:focus-visible{outline:2px solid var(--ink-3);outline-offset:2px}
</style>
</head>
<body>
<header>
  <a class="home" href="../">Copius</a>
  <nav><a id="toAtlas" href="../atlas.html">Ouvrir l’atlas</a></nav>
</header>

<main>
<h1 id="title">Connexion à Copius</h1>
<p class="lede" id="msg" role="status"></p>
<button type="button" class="cx" id="go" hidden></button>
</main>

<script src="../js/i18n.js?v=215"></script>
<script>
/* The page a sign-in link opens: https://copius.fr/connexion/#t=<token>&l=fr.
   What follows the # never reaches a server, a log or a Referer, and it leaves
   the address bar at once. The token is spent only on a click, so a mail
   scanner that opens the link cannot use it. Five endings: signed in (on to the
   home page), link expired or used, no access, cookies refused, no token. */
(function () {
  var h = location.hash, tok = (/(?:^#|&)t=([A-Za-z0-9_-]+)/.exec(h) || [])[1] || "";
  /* The link's language, else the atlas's own order: the saved choice, then
     the browser's. */
  var saved = ""; try { saved = localStorage.getItem("atlas-lang") || ""; } catch (e) {}
  var lang = (/(?:^#|&)l=(en|fr)(?:&|$)/.exec(h) || [])[1] ||
    (/^(en|fr)$/.test(saved) ? saved : /^fr/i.test(navigator.language || "") ? "fr" : "en");
  if (h && history.replaceState) history.replaceState(null, "", location.pathname);
  var t = window.I18N[lang], msg = document.getElementById("msg"), go = document.getElementById("go");
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = t.cxTitle;
  document.getElementById("toAtlas").textContent = t.cxAtlas;
  function say(key) { msg.textContent = t[key]; }
  if (!tok) { say("cxNoToken"); return; }
  say("cxLead");
  go.textContent = t.cxBtn;
  go.hidden = false;
  go.addEventListener("click", function () {
    go.disabled = true;
    fetch("/api/verify.php", { method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: tok }) })
      .then(function (r) { return r.status; }, function () { return 0; })
      .then(function (s) {
        if (s === 200) {
          /* The server set both cookies; without the marker the atlas would
             never ask for the full version, so a refusal is said here. */
          if (!/(?:^|;\s*)__Host-copius_full=1(?:;|$)/.test(document.cookie)) { go.hidden = true; return say("cxCookies"); }
          /* The site's other open tabs reload into the full version. */
          if (window.BroadcastChannel) new BroadcastChannel("copius-session").postMessage("changed");
          /* The home page, as for everyone; its button opens the atlas, now full. */
          location.replace("/");
          return;
        }
        if (s === 410 || s === 403) { go.hidden = true; return say(s === 410 ? "cxExpired" : "sessionNoAccess"); }
        /* Offline, or too many tries from this connection: the token is still
           good, so the button stays. */
        go.disabled = false;
        say("cxError");
      });
  });
})();
</script>
</body>
</html>
