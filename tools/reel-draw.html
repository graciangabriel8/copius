<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Copius — reel, a drawing that draws itself</title>
<!-- The "draw" reel, filmed by tools/drawreel.swift (never recorded by hand):
       reel-draw.html?copy=draw-cashew&lang=fr[&guides=1]
     One ingredient: its surprising fact on screen from the first frame (the payoff lands
     inside the first second: the lab reel's curve lost half its viewers by 2.0 s), its
     atlas drawing drawn stroke by stroke under it, then one line that explains, then the
     end card. Little
     text on purpose: Instagram holds back reels that are "majority text" or muted
     (about.instagram.com, Instagram Ranking Explained), so the drawing carries the
     reel and the music is added in the app when posting.
     Every frame is a pure function of t (window.__frame(t)); nothing animates on its
     own, so the recorder's frames are exact whatever the render speed. -->
<style>
  :root{--bg:#F7F6F1;--ink:#1E211A;--ink2:#565A4C;--ink3:#6A6E5F;--accent:#4F5B3F;--end:#F1F1F0;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color-scheme:light}
  *{box-sizing:border-box}
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
  #stage{position:relative;width:1080px;height:1920px;background:var(--bg);font-family:var(--sans);color:var(--ink)}
  .hook{position:absolute;left:90px;right:90px;top:330px;text-align:center;font-family:var(--serif);
    font-size:66px;line-height:1.14;letter-spacing:-.01em}
  .hook span{display:block;text-wrap:balance}
  .hook .q{color:var(--accent);font-style:italic;margin-top:14px}
  #art{position:absolute;left:0;top:0;width:760px;height:760px;transform-origin:0 0}
  #art svg{width:100%;height:100%;display:block;overflow:visible}
  .line{position:absolute;left:110px;right:110px;top:1320px;text-align:center;font-size:40px;line-height:1.36;color:var(--ink2);text-wrap:balance}
  #end{position:absolute;inset:0;background:var(--end);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
  #end img{width:260px;height:260px;border-radius:50%}
  #end .url{font-family:var(--serif);font-size:88px;letter-spacing:-.01em}
  #end .tag{font-size:40px;color:var(--ink3);text-align:center;max-width:820px;line-height:1.3}
  .guide{position:absolute;left:0;right:0;border-top:4px dashed #d23;z-index:9}
  .guide.v{top:auto;bottom:auto;border-top:none;border-left:4px dashed #d23;width:0}
</style>
</head>
<body>
<div id="stage">
  <div class="hook" id="hook"><span id="h1"></span><span class="q" id="h2"></span></div>
  <div id="art"></div>
  <div class="line" id="line"></div>
  <div id="end"><img src="../brand/copius-profile.png" alt=""><div class="url">copius.fr</div><div class="tag" id="tag"></div></div>
</div>
<script>
(function () {
  var P = new URLSearchParams(location.search), LANG = P.get("lang") === "en" ? "en" : "fr";
  var DUR = 10;
  window.__duration = DUR;
  window.__ready = false;
  function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function ease(x) { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function span(t, a, b) { return clamp((t - a) / (b - a)); }
  var $ = function (id) { return document.getElementById(id); };

  // Safe area, as in tools/factreel.swift: the top 300 px and everything under 1500 px
  // sit under the phone's header and caption; the feed crops 285 px off each end.
  if (P.get("guides")) [285, 300, 1500, 1635].forEach(function (y) {
    var g = document.createElement("div"); g.className = "guide"; g.style.top = y + "px"; $("stage").appendChild(g);
  });

  var strokes = [], bg = null;
  fetch("facts/" + (P.get("copy") || "draw-cashew") + ".json").then(function (r) { return r.json(); }).then(function (copy) {
    var C = copy[LANG];
    $("h1").textContent = C.hook; $("h2").textContent = C.question;
    $("line").textContent = C.line; $("tag").textContent = C.end;
    document.documentElement.lang = LANG;
    return fetch("../img/" + copy.id + ".svg").then(function (r) { if (!r.ok) throw new Error("no drawing for " + copy.id); return r.text(); });
  }).then(function (svg) {
    $("art").innerHTML = svg;
    var el = $("art").querySelector("svg");
    el.removeAttribute("width"); el.removeAttribute("height");
    bg = el.querySelector(".bg");
    // Everything that is not the background disc is drawn, in document order: the
    // stroke runs along the shape, then its fill comes in behind it.
    [].forEach.call(el.querySelectorAll("path,circle,ellipse,line,polyline,polygon,rect"), function (n) {
      if (n === bg) return;
      n.setAttribute("pathLength", "1");
      n.style.strokeDasharray = "1 1";
      strokes.push(n);
    });
    return document.fonts ? document.fonts.ready : null;
  }).then(function () { window.__frame(0); window.__ready = true; })
    .catch(function (e) { window.__error = String(e && e.message || e); });

  window.__frame = function (t) {
    if (!strokes.length) return "not ready";
    // 0 — the fact and the disc are there on the first frame, which is also the cover;
    // the fact stays up until the end card.
    // 0.15–3.9 — the drawing draws itself, each stroke a share of the time, overlapping.
    var a = .15, z = 3.9, n = strokes.length, each = (z - a) / (n * .75 + .25);
    strokes.forEach(function (s, i) {
      var s0 = a + i * each * .75, p = ease(span(t, s0, s0 + each));
      s.style.strokeDashoffset = String(1 - p);
      s.style.strokeOpacity = p > 0 ? "1" : "0";
      s.style.fillOpacity = String(ease(span(t, s0 + each * .7, s0 + each * .7 + .45)));
    });
    // The drawing sits between the fact and the line; 4.1–4.7 — the line that explains.
    var size = 600, cx = 540, cy = 985;
    $("art").style.transform = "translate(" + (cx - size / 2) + "px," + (cy - size / 2) + "px) scale(" + (size / 760) + ")";
    var ln = ease(span(t, 4.1, 4.7));
    $("line").style.opacity = String(ln); $("line").style.transform = "translateY(" + (18 * (1 - ln)) + "px)";
    // 8.6–9.1 — the end card.
    $("end").style.opacity = String(ease(span(t, 8.6, 9.1)));
    return true;
  };
})();
</script>
</body>
</html>
