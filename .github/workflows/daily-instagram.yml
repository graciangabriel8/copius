name: Daily ingredient to Instagram

# Posts the day's ingredient from social/schedule.json. The picture is
# pre-built and committed, so this job only calls the API.
on:
  schedule:
    # This cron is UTC, it is deliberately early, and the job waits for the
    # wall clock rather than trusting the cron to land on it.
    #
    # The timezone: key was here and does nothing. Four scheduled runs after it
    # was added were created at 19:28, 19:14, 19:16 and 18:44 UTC — that is
    # -1 to +43 minutes around 18:45 UTC, which is GitHub's ordinary jitter, and
    # +119 to +163 around 16:45 UTC, which is what "18:45 Europe/Paris" means in
    # summer. A run a minute before 18:45 UTC cannot be a late 16:45 one. The
    # posts were landing at 21:00, mid-service.
    #
    # Off the top of the hour on purpose. GitHub: "High load times include the
    # start of every hour… schedule your workflow to run at a different time of
    # the hour." A run at the top of the hour was once delayed by 90 minutes.
    #
    # The jitter is no longer minutes. From 19 Sept to 1 Oct 2026 a 13:35 UTC
    # cron was started between 16:41 and 20:11 UTC — 3 h to 6 h 36 late, so the
    # card went out at 18:40–22:10 in Paris, mid-service, every day. So the job
    # is started three times in the morning and the hold below decides: a start
    # more than 5 h 35 before 17:00 Paris steps aside (GitHub kills a job at
    # 6 h), the first one within reach waits for the wall clock, and the ones
    # after it queue behind it in the concurrency group and find the card up.
    # On time, the 09:35 start posts in summer and the 11:35 one in winter;
    # 3 to 7 h 25 late, the 07:35 start does.
    - cron: "35 7 * * *"
    - cron: "35 9 * * *"
    - cron: "35 11 * * *"
  workflow_dispatch:          # lets you run it by hand from the Actions tab

concurrency:
  # Scheduled starts queue in one lane; a run started by hand has its own, so
  # it never waits hours behind a holding start or gets cancelled by the next
  # one. The duplicate guards cover a manual run overlapping a scheduled one.
  group: daily-instagram-${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 17:00 in Paris, whatever the cron managed. date reads the zone from
      # tzdata, so the October change is handled by the same line. A run started
      # by hand posts immediately — waiting is for the scheduled one.
      - name: Hold until 17:00 in Paris
        id: hold
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          target="$(TZ=Europe/Paris date -d 'today 17:00' +%s)"
          now="$(date +%s)"
          wait=$(( target - now ))
          echo "now      $(TZ=Europe/Paris date -d "@$now" '+%F %H:%M %Z')"
          echo "posting  $(TZ=Europe/Paris date -d "@$target" '+%F %H:%M %Z')"
          if [ "$wait" -le 0 ]; then
            echo "::warning::started at or after 17:00 Paris — posting now, $(( -wait / 60 )) min late"
            exit 0
          fi
          # Too early to wait inside GitHub's 6 h job limit: step aside, a later
          # start of the three posts the card. The steps below read skip.
          if [ "$wait" -gt 20100 ]; then
            echo "::notice::$(( wait / 60 )) min until 17:00 Paris — too early to wait; a later start posts the card"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "waiting $(( wait / 60 )) min"
          sleep "$wait"

      - name: Work out today's ingredient
        id: pick
        if: steps.hold.outputs.skip != '1'
        run: |
          set -euo pipefail
          # The date is pinned once and reused, so the picture and the caption
          # cannot come from two different days if the job straddles midnight.
          DATE="$(date -u +%F)"
          ID="$(python3 tools/make-card.py --today-id)"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Today: $ID ($DATE)"
          for f in "social/$ID.jpg" "social/$ID.2.jpg"; do
            test -f "$f" || { echo "::error::$f is missing — the card window has run out. Run: python3 tools/build-schedule.py && sh tools/build-social.sh && git add social && git commit && git push"; exit 1; }
          done
          # warn while there is still time to build more cards: count the days
          # until the first scheduled ingredient that has no jpg yet
          LEFT="$(python3 -c 'import json,datetime,os; s=json.load(open("social/schedule.json")); t=(datetime.date.today()-datetime.date.fromisoformat(s["start"])).days; d=s["days"]; print(next((n for n in range(len(d)-t) if not os.path.exists("social/%s.jpg" % d[t+n])), len(d)-t))')"
          # An `if`, not `[ ] && echo` — under set -e a false test makes the
          # && chain return non-zero, and as the step's last command that
          # fails the whole job. The warning fired by not firing.
          if [ "$LEFT" -lt 40 ]; then
            echo "::warning::only $LEFT days of cards left — run: sh tools/build-social.sh && git add social && git commit && git push"
          fi

      - name: Publish
        if: steps.hold.outputs.skip != '1'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ID: ${{ steps.pick.outputs.id }}
          DATE: ${{ steps.pick.outputs.date }}
        run: |
          set -euo pipefail
          : "${IG_USER_ID:?set the IG_USER_ID repository secret}"
          : "${IG_ACCESS_TOKEN:?set the IG_ACCESS_TOKEN repository secret}"
          IMG="https://copius.fr/social/$ID.jpg"
          IMG2="https://copius.fr/social/$ID.2.jpg"
          # Derived here, not read from a committed copy: a change to caption()
          # then reaches the next post without a regeneration step to forget.
          CAPTION="$(python3 tools/make-card.py --caption "$DATE")"
          test -n "$CAPTION" || { echo "::error::empty caption for $ID"; exit 1; }

          # 0. has today already gone out? The job posts whatever the date picks,
          # every time it runs, so a manual run plus the cron would put the same
          # card up twice on a public profile. Ask Instagram for the newest card
          # and compare dates. Carousels only: a reel (reels-instagram.yml, 15:30
          # on its days) is not the card, and counting it would skip the day's.
          # An unreadable answer yields an empty string, which never equals
          # $DATE, so the day's post still goes out — a missed day is invisible
          # and this check exists only to stop a visible duplicate.
          LATEST="$(curl -sS -G "https://graph.instagram.com/v23.0/$IG_USER_ID/media" \
            --data-urlencode "fields=timestamp,media_type" --data-urlencode "limit=10" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN" \
            | python3 -c 'import sys,json
          try: d = json.load(sys.stdin).get("data") or []
          except ValueError: d = []
          d = [m for m in d if m.get("media_type") == "CAROUSEL_ALBUM"] or [{}]
          print((d[0].get("timestamp") or "")[:10])')"
          echo "last post: ${LATEST:-<none>} | today: $DATE"
          if [ "$LATEST" = "$DATE" ]; then
            echo "::notice::already posted today ($DATE) — nothing to do"
            exit 0
          fi

          # 1. containers. A carousel is built bottom-up: one container per
          # slide carrying is_carousel_item, then a parent holding their ids.
          # The caption belongs to the parent only — a child that carries one is
          # accepted and then silently ignored.
          ITEM1="$(curl -sS -X POST "https://graph.instagram.com/v23.0/$IG_USER_ID/media" \
            --data-urlencode "image_url=$IMG" \
            -d "is_carousel_item=true" -d "access_token=$IG_ACCESS_TOKEN")"
          ITEM2="$(curl -sS -X POST "https://graph.instagram.com/v23.0/$IG_USER_ID/media" \
            --data-urlencode "image_url=$IMG2" \
            -d "is_carousel_item=true" -d "access_token=$IG_ACCESS_TOKEN")"
          jid() { printf '%s' "$1" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))'; }
          C1="$(jid "$ITEM1")"; C2="$(jid "$ITEM2")"
          if [ -z "$C1" ] || [ -z "$C2" ]; then
            echo "::error::carousel item failed: $(printf '%s%s' "$ITEM1" "$ITEM2" | head -c 400)"; exit 1
          fi
          echo "slides: $C1 (card) $C2 (tip)"

          CREATE="$(curl -sS -X POST "https://graph.instagram.com/v23.0/$IG_USER_ID/media" \
            -d "media_type=CAROUSEL" \
            -d "children=$C1,$C2" \
            --data-urlencode "caption=$CAPTION" \
            -d "access_token=$IG_ACCESS_TOKEN")"
          CID="$(jid "$CREATE")"
          if [ -z "$CID" ]; then echo "::error::container failed: $(printf '%s' "$CREATE" | head -c 400)"; exit 1; fi

          # 2. wait for Instagram to finish fetching the image.
          # Publishing straight after creating the container is a race: the container
          # exists before the media is ready, and media_publish then answers 9007
          # "Media ID is not available". Meta's guidance is to query the container
          # once a minute for at most five.
          STATUS=""
          for i in 1 2 3 4 5; do
            STATUS="$(curl -sS -G "https://graph.instagram.com/v23.0/$CID" \
              --data-urlencode "fields=status_code" \
              --data-urlencode "access_token=$IG_ACCESS_TOKEN" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin).get("status_code",""))')"
            echo "container $CID: ${STATUS:-<no status>} (check $i/5)"
            case "$STATUS" in
              FINISHED) break ;;
              ERROR|EXPIRED) echo "::error::container ended as $STATUS"; exit 1 ;;
            esac
            [ "$i" = 5 ] || sleep 60
          done
          if [ "$STATUS" != "FINISHED" ]; then
            echo "::error::container still $STATUS after five minutes"; exit 1
          fi

          # 3. publish
          PUB="$(curl -sS -X POST "https://graph.instagram.com/v23.0/$IG_USER_ID/media_publish" \
            -d "creation_id=$CID" -d "access_token=$IG_ACCESS_TOKEN")"
          printf '%s' "$PUB" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("published",d["id"]) if d.get("id") else sys.exit("publish failed: "+json.dumps(d)[:400])'
          # A queued start follows within seconds: hold the group two minutes so
          # its guard reads a media list that already shows this post.
          if [ "${{ github.event_name }}" = "schedule" ]; then sleep 120; fi
